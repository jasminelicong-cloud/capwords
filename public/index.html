<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapWords</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #FFE5EC 0%, #FFF0F5 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .navbar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 20px 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 28px; font-weight: 700; color: #FF6B9D; }
        .stats { display: flex; gap: 30px; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 32px; font-weight: 700; color: #FF6B9D; }
        .stat-label { font-size: 14px; color: #666; margin-top: 5px; }
        .camera-section { text-align: center; margin: 50px 0; }
        .camera-btn { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #FF6B9D, #C44569); border: none; font-size: 48px; cursor: pointer; box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4); transition: all 0.3s; }
        .camera-btn:hover { transform: scale(1.1); }
        .camera-hint { margin-top: 20px; font-size: 16px; color: #666; }
        #fileInput { display: none; }
        .loading { display: none; text-align: center; padding: 40px; }
        .spinner { width: 50px; height: 50px; border: 4px solid #FFE5EC; border-top-color: #FF6B9D; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; margin-top: 30px; }
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
        .card:hover { transform: translateY(-5px); }
        .card-image { width: 100%; height: 300px; object-fit: cover; }
        .card-content { padding: 25px; }
        .card-text { font-family: 'Courier New', monospace; font-size: 1.4em; color: #000; margin-bottom: 10px; }
        .card-sentence { font-family: 'Courier New', monospace; font-size: 0.9em; color: #666; margin-bottom: 20px; }
        .card-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .action-btn { background: none; border: none; font-size: 1.3em; cursor: pointer; }
        .empty-state { text-align: center; padding: 80px 20px; color: #999; }
        .notification { position: fixed; top: 20px; right: 20px; background: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); z-index: 1000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <div class="logo">📚 CapWords</div>
            <div class="stats">
                <div class="stat-item"><div class="stat-number" id="totalCount">0</div><div class="stat-label">学习词汇</div></div>
                <div class="stat-item"><div class="stat-number" id="todayCount">0</div><div class="stat-label">今日新增</div></div>
            </div>
            <button onclick="promptForBotKey()" style="padding: 8px 15px; background: #FF6B9D; color: white; border: none; border-radius: 5px; cursor: pointer;">⚙️ 设置</button>
        </div>
        <div class="camera-section">
            <button class="camera-btn" id="cameraBtn">📷</button>
            <p class="camera-hint">点击拍照，开始学习</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>卡片生成中……</p>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
        <div class="empty-state" id="emptyState">
            <div style="font-size: 80px; margin-bottom: 20px;">��</div>
            <p>还没有学习卡片</p>
        </div>
    </div>
    <script>
        const BACKEND_URL = '';
        let cards = [];
        const cameraBtn = document.getElementById('cameraBtn');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const cardsGrid = document.getElementById('cardsGrid');
        const emptyState = document.getElementById('emptyState');
        
        window.addEventListener('load', () => {
            loadCards();
            updateStats();
            cameraBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleImageUpload);
            console.log('✅ CapWords loaded');
        });
        
        function promptForBotKey() {
            const newKey = prompt('请输入 BOT_APP_KEY:', BOT_APP_KEY);
            if (newKey !== null) {
                BOT_APP_KEY = newKey;
                localStorage.setItem('capwords_bot_app_key', newKey);
                alert('✅ BOT_APP_KEY 已保存');
            }
        }
        
                function loadCards() {
            const saved = localStorage.getItem('capwords_cards');
            if (saved) cards = JSON.parse(saved);
            renderCards();
        }
        
        function saveCards() {
            localStorage.setItem('capwords_cards', JSON.stringify(cards));
        }
        
        function updateStats() {
            document.getElementById('totalCount').textContent = cards.length;
        }
        
        function renderCards() {
            if (cards.length === 0) {
                emptyState.style.display = 'block';
                cardsGrid.style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                cardsGrid.style.display = 'grid';
                cardsGrid.innerHTML = '';
                cards.forEach((card, index) => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `${card.imageUrl ? `<img src="${card.imageUrl}" class="card-image">` : ''}<div class="card-content">${card.english ? `<div class="card-text">${card.english}</div>` : ''}${card.japanese ? `<div class="card-text">${card.japanese}</div>` : ''}${card.sentence ? `<div class="card-sentence">${card.sentence}</div>` : ''}<div class="card-actions"><button class="action-btn" onclick="playPronunciation('${card.english}')">🔊</button><button class="action-btn" onclick="deleteCard(${index})">🗑️</button></div></div>`;
                    cardsGrid.appendChild(div);
                });
            }
        }
        
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            loading.style.display = 'block';
            emptyState.style.display = 'none';
            try {
                const formData = new FormData();
                formData.append('file', file);
                const uploadResponse = await fetch(`${BACKEND_URL}/api/upload-image`, { method: 'POST', body: formData });
                if (!uploadResponse.ok) throw new Error('上传失败');
                const uploadResult = await uploadResponse.json();
                const imageUrl = uploadResult.url;
                const sseResponse = await fetch(`${BACKEND_URL}/api/chat-sse`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image_url: imageUrl, query: '请识别这个物体，并按照以下JSON格式返回：{"object":"英文名称","japanese":"日文名称","example":"例句"}。只返回JSON，不要其他内容。', bot_app_key: BOT_APP_KEY }) });
                if (!sseResponse.ok) throw new Error('AI失败');
                const result = await handleSSEResponse(sseResponse);
                const cardData = parseAIResponse(result, imageUrl);
                if (cardData) {
                    cards.unshift(cardData);
                    saveCards();
                    updateStats();
                    renderCards();
                    showNotification('✅ 卡片已生成！');
                } else throw new Error('解析失败');
            } catch (error) {
                console.error('错误:', error);
                showNotification('❌ ' + error.message);
            } finally {
                loading.style.display = 'none';
                fileInput.value = '';
            }
        }
        
        async function handleSSEResponse(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let finalContent = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    try {
                        const eventData = JSON.parse(line.substring(6));
                        if (eventData.type === 'reply') {
                            const payload = eventData.payload?.payload || eventData.payload;
                            if (!payload.is_from_self && payload.content) finalContent = payload.content;
                            if (payload.is_final) break;
                        }
                    } catch (e) {}
                }
            }
            return { content: finalContent };
        }
        
        function parseAIResponse(result, imageUrl) {
            try {
                let content = (result.content || '').trim();
                console.log('📋 原始响应:', content.substring(0, 300));
                
                let english = '', japanese = '', sentence = '';
                
                // 尝试JSON
                try {
                    let jsonStr = content;
                    if (jsonStr.startsWith('```')) jsonStr = jsonStr.replace(/^```[^\n]*\n?/, '').replace(/\n?```$/, '');
                    const data = JSON.parse(jsonStr);
                    console.log('✅ JSON结构:', Object.keys(data));
                    // 直接字段
                    english = data.object || data.name || data.word || data.english || '';
                    japanese = data.japanese || data.ja || data.jap || '';
                    sentence = data.example || data.sentence || data.context || '';
                    
                    // 嵌套结构
                    if (!english && data.data?.primary_object?.object) {
                        english = data.data.primary_object.object;
                        japanese = data.data.primary_object.japanese || '';
                        sentence = data.data.primary_object.example || '';
                    }
                } catch (e) {}
                
                // 如果JSON成功且有内容，直接返回
                if (english || japanese) {
                    return {
                        id: Date.now(),
                        english: english.substring(0, 50),
                        japanese: japanese.substring(0, 50),
                        sentence: sentence.substring(0, 200),
                        imageUrl: imageUrl,
                        createdAt: new Date().toISOString()
                    };
                }
                
                // 用正则从纯文本提取
                if (!english) {
                    const lines = content.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    const englishLines = [];
                    const japaneseLines = [];
                    
                    for (const line of lines) {
                        const hasE = /[a-zA-Z]/.test(line);
                        const hasJ = /[\u4e00-\u9fff\u3040-\u309f]/.test(line);
                        
                        if (hasE && !hasJ) englishLines.push(line);
                        else if (hasJ && !hasE) japaneseLines.push(line);
                    }
                    
                    if (englishLines.length > 0) {
                        englishLines.sort((a, b) => a.length - b.length);
                        for (const line of englishLines) {
                            if (line.length < 50) { english = line; break; }
                        }
                    }
                    
                    if (japaneseLines.length > 0) {
                        japanese = japaneseLines[0];
                    }
                    
                    if (!english && lines.length > 0) {
                        const first = lines[0].replace(/^[-*•·`\*\s]*/, '').trim();
                        if (first.length > 0 && first.length < 50) english = first;
                    }
                }
                
                console.log('✔️  提取结果:', { english, japanese, sentence });
                
                return {
                    id: Date.now(),
                    english: (english || 'Item').substring(0, 50),
                    japanese: (japanese || '').substring(0, 50),
                    sentence: (sentence || '').substring(0, 200),
                    imageUrl: imageUrl,
                    createdAt: new Date().toISOString()
                };
            } catch (error) {
                console.error('解析错误:', error);
                return null;
            }
        }
        
        function deleteCard(index) {
            if (confirm('删除？')) {
                cards.splice(index, 1);
                saveCards();
                updateStats();
                renderCards();
            }
        }
        
        function playPronunciation(text) {
            if (!text) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            speechSynthesis.speak(u);
        }
        
        function showNotification(message) {
            const n = document.createElement('div');
            n.className = 'notification';
            n.textContent = message;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }
    </script>
</body>
</html>
